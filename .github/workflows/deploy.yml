name: Deploy to Render

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_URL" ]; then
            echo "::error::Set the RENDER_DEPLOY_URL secret to enable auto-deploy."
            exit 1
          fi
          curl --fail --show-error --silent --output /dev/null --write-out "Render deploy trigger responded with HTTP %{http_code}\n" --request POST "$RENDER_DEPLOY_URL"
